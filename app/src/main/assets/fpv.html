<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<script src="cesium/Cesium.js"></script>
<link rel="stylesheet" href="cesium/Widgets/widgets.css" />
<style>
  html, body { height:100%; margin:0; padding:0; background:#0b1016; overflow:hidden; }
  #view { position:fixed; inset:0; }
  /* Boxed into the middle of the panel rather than spread across all of it:
     at full width and 13px this ran under the wind readout, the battery block
     and the heading tape, which is the first thing a new reader sees. */
  #message {
      /* Fixed, not absolute: body's height collapses to zero in this WebView,
         so percentages against it put the box at the top with no height at
         all. The viewport is the one box here with real dimensions. */
      position:fixed; left:18%; right:18%; top:28%; bottom:20%;
      display:none; align-items:center; justify-content:center;
      text-align:center; font-family:sans-serif;
      color:#c8d4de; font-size:9px; line-height:1.55;
      background:rgba(8,12,18,0.85); border-radius:6px; padding:10px 14px;
  }
  /* Cesium's own chrome has no place in a cockpit view. Its credit line stays:
     showing attribution is a condition of using the data. */
  .cesium-viewer-toolbar, .cesium-viewer-animationContainer,
  .cesium-viewer-timelineContainer, .cesium-viewer-fullscreenContainer {
      display:none !important;
  }
  /* The credit line stays — showing attribution is a condition of using the
     data — but at its default size it sprawls across the bottom of the HUD and
     collides with the throttle column and the EKF flags. Sized down and boxed
     into the gap between the two instead: left of it is the throttle, right of
     it the flags, and this is the strip nothing else occupies. */
  /* The credit line stays — showing attribution is a condition of using the
     data — but at its own size and position it sprawls along the bottom of the
     HUD, under the throttle column at one end and the EKF and VIBE flags at
     the other. Boxed into the clear strip between the two instead.

     The positioned element is .cesium-viewer-bottom, and Cesium resets its
     left and right on every resize; !important in a stylesheet outranks the
     inline styles it writes, where setting them from script does not. */
  .cesium-viewer-bottom {
      left:0 !important; right:0 !important; bottom:0 !important;
      opacity:0.6;
      pointer-events:none;
  }
  /* The attribution is split across the two clear strips the instruments
     leave: the logo between the throttle column and the EKF flag, the links
     between the VIBE flag and the FPV switch. Both are pinned to the viewport
     rather than laid out in a row, because the flags sit between them and a
     single row would run underneath. */
  .cesium-credit-logoContainer {
      position:fixed !important;
      left:62px !important; bottom:3px !important;
      max-width:118px; overflow:hidden;
  }
  .cesium-widget-credits {
      position:fixed !important;
      /* The true gap between the VIBE flag and the FPV switch, measured off
         the panel: the flag ends at 285 and the switch starts at 371, and
         this spans 288 to 372. Lifted so the three lines sit centred on the
         flags' own middle rather than along the bottom edge. */
      left:calc(50% + 52px) !important; right:100px !important; bottom:7px !important;
      /* Small enough that the whole notice fits across two lines. The text is
         set in full on purpose: it is Cesium's, the free tier requires it, and
         a credit chopped off mid-word is worse than a small one. */
      font-size:6px !important;
      line-height:7.5px !important;
      display:block !important;
      white-space:normal !important;
      overflow:visible;
      text-align:center;
  }
  /* Each part on its own block. As inline runs they share a line box with the
     logo container, and even pinned out of flow it still lends that first line
     an indent, so "Upgrade" started a few pixels right of "commercial" beneath
     it. Blocks do not share a line with anything, so every line starts flush. */
  .cesium-credit-textContainer,
  .cesium-credit-expand-link,
  .cesium-credit-textContainer .cesium-credit-wrapper,
  .cesium-credit-textContainer a {
      display:block !important;
      text-indent:0 !important;
      margin:0 !important;
      padding:0 !important;
  }
  /* The logo ships at a size meant for a full browser window. */
  .cesium-credit-logoContainer img { height:11px !important; width:auto !important; }
  .cesium-widget-credits a { text-decoration:none; color:#cfd8e0; }
</style>
</head>
<body>
<div id="view"></div>
<div id="message"></div>
<script>
var viewer = null;
var started = false;
/** Never sit the eye exactly on the ground: at zero you see nothing at all. */
var MIN_EYE_M = 1.5;

function say(html) {
  var m = document.getElementById('message');
  m.style.display = 'flex';
  // One child, so the flex box centres a block of text rather than laying the
  // heading and the body out as columns beside each other.
  m.innerHTML = '<div>' + html + '</div>';
}

/**
 * Bring the scene up.
 *
 * Deliberately not done at load: without a token there is nothing to show, and
 * building a viewer only to tear it down costs a GL context for nothing.
 */
function start(token) {
  if (started) { return; }
  if (typeof Cesium === 'undefined') {
    say('The 3D engine did not load.');
    return;
  }
  try {
    Cesium.Ion.defaultAccessToken = token;
    viewer = new Cesium.Viewer('view', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      // Measured on the tablet at 24fps against 60 without. Worth it: the
      // camera is flown by telemetry arriving a few times a second, so frames
      // beyond that rate buy nothing, where a staircased horizon and ridge
      // line are visible every one of them.
      msaaSamples: 4,
      contextOptions: { webgl: { antialias: true } },
      animation: false, timeline: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, fullscreenButton: false,
      infoBox: false, selectionIndicator: false,
    });
    // The camera is flown by the aircraft, not by fingers: a stray drag that
    // moved it would be lying about where the aeroplane is pointing.
    viewer.scene.screenSpaceCameraController.enableInputs = false;
    viewer.scene.globe.depthTestAgainstTerrain = true;
    // Render at the screen's real pixels, not CSS pixels.
    //
    // Cesium's default sizes the drawing buffer to the CSS box and ignores the
    // device pixel ratio, which is a sensible default on a desktop monitor
    // where the two are the same. This panel is 472x256 CSS on a 2.125x
    // display, so the globe was being drawn 472 across and stretched over 1003
    // real pixels: a soft image with a visibly stepped horizon that no amount
    // of MSAA can fix, because the staircase is in the upscale, not the edge.
    //
    // Measured on the tablet: 60fps at the CSS size against 42 here, for 4.5x
    // the pixels. Well clear of the few-hertz rate the camera is actually
    // flown at, which is the rate that decides whether this looks right.
    viewer.useBrowserRecommendedResolution = false;
    viewer.resolutionScale = 1.0;
    // The rest of what Cesium offers is left on: the fog and ground atmosphere
    // that give distance something to read against. All of it was off while
    // the question was whether this could run at all. (FXAA is not among them
    // — Cesium drops it when MSAA is on, and the two would be redundant.)
    document.getElementById('message').style.display = 'none';
    started = true;
  } catch (e) {
    say('The 3D view could not start.<br>' + e);
  }
}

function needToken() {
  say('<b style="color:#fff">Cesium Ion token needed</b><br>' +
      'Create a free account at cesium.com/ion and paste the<br>' +
      'access token into Settings.');
}

/**
 * Put the camera where the aeroplane is, pointing where it points.
 *
 * Straight from ATTITUDE: Cesium takes heading, pitch and roll natively, so
 * there is no conversion to get wrong.
 */
/**
 * The height to hand Cesium, in Cesium's own datum.
 *
 * The obvious value, the vehicle's altitude AMSL, is the wrong one: Cesium
 * measures height from the WGS84 ellipsoid and MAVLink reports it from mean
 * sea level, and the two differ by the geoid separation — tens of metres, and
 * a different number everywhere. Fed in straight it buries the camera that far
 * underground, which is exactly what it did here: parked at 350m over terrain
 * Cesium put at 567m, the view was the inside of a hill.
 *
 * Measuring up from Cesium's own terrain keeps both numbers in one datum and
 * is right anywhere, with no geoid model to ship.
 */
function cameraHeight(altMsl, agl, lat, lon) {
  var ground;
  try {
    ground = viewer.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(lon, lat));
  } catch (e) {
    ground = undefined;
  }
  if (typeof ground === 'number' && isFinite(ground)) {
    return ground + Math.max(agl, MIN_EYE_M);
  }
  // This spot has not streamed in yet. AMSL is off by the geoid separation,
  // but it is the only height there is until it does.
  return altMsl;
}

function setPose(lat, lon, alt, agl, yaw, pitch, roll) {
  if (!started || !viewer) { return; }
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, cameraHeight(alt, agl, lat, lon)),
    orientation: {
      heading: Cesium.Math.toRadians(yaw),
      pitch: Cesium.Math.toRadians(pitch),
      roll: Cesium.Math.toRadians(roll),
    },
  });
}
</script>
</body>
</html>
